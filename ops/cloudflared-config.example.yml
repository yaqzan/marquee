# Optional: publish Marquee through a Cloudflare tunnel.
# Copy to ops/cloudflared-config.yml (gitignored) and fill in your own tunnel:
#   cloudflared tunnel create marquee
#   cloudflared tunnel route dns <tunnel-uuid> marquee.example.com
#
# Run: cloudflared tunnel --config ops/cloudflared-config.yml run marquee
tunnel: <tunnel-uuid>
credentials-file: <path-to-your-.cloudflared>/<tunnel-uuid>.json

ingress:
  - hostname: marquee.example.com
    service: http://127.0.0.1:5007
  - service: http_status:404
